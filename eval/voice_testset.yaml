# Step 3 語音端到端測試集
#
# 每題 = 一次連線；turns 是使用者依序說的話（多句 = 多輪對話）。
# 音檔：scripts/make_voice_testset.py 用 TTS 合成到 eval/voice/utterances/<id>_<n>.wav（16kHz）
#   ⚠ 合成語音比真人清楚，ASR 分數會偏樂觀；之後可以把同名檔案換成自己的錄音。
# focus：這題主要在測什麼（asr / latency / brain / tool）
# exit: true：最後一句是道別，應該結束對話（其他句都不應該結束）

